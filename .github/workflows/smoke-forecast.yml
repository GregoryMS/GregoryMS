name: Refresh smoke forecast

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_smoke_forecast.py
      - .github/workflows/smoke-forecast.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: smoke-forecast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1
      - run: python -m unittest discover -s tests -p 'test_smoke_forecast.py'
      - run: python scripts/update_smoke_forecast.py
      - name: Save smoke data and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/smoke-forecast.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smoke-forecast.json
          git commit -m "Refresh FireSmoke forecast data"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
