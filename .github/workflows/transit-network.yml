name: Refresh Victoria and Vancouver transit maps

on:
  schedule:
    - cron: '37 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_transit_network.py
      - .github/workflows/transit-network.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: transit-network
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_transit_network.py'
      - run: python3 scripts/update_transit_network.py
      - name: Save route maps and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -z "$(git status --porcelain -- data/transit)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit
          git commit -m "Refresh Victoria and Vancouver route maps"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
